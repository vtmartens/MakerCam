version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "nuget"
    directory: "/dotnet/src/MakerCam.App"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      nuget-app-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "nuget"
    directory: "/dotnet/src/MakerCam.Core"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      nuget-core-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "nuget"
    directory: "/dotnet/tests/MakerCam.Core.Tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      nuget-tests-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
