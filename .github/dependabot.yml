version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Vitest 5 requires Node 22.12+, but MakerCam supports Node 20.19+.
    ignore:
      - dependency-name: "vitest"
        versions:
          - ">=5.0.0"
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "nuget"
    directory: "/dotnet/src/MakerCam.App"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      nuget-app-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "nuget"
    directory: "/dotnet/src/MakerCam.Core"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      nuget-core-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "nuget"
    directory: "/dotnet/tests/MakerCam.Core.Tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      nuget-tests-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "nuget"
    directory: "/dotnet/.config"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # WiX 6+ requires the Open Source Maintenance Fee EULA; the installer pins 5.x.
    ignore:
      - dependency-name: "wix"
        versions:
          - ">=6.0.0"
